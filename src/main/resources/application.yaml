spring:
  application:
    name: oficinatrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:loaijnupr9384}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
api:
  security:
    token:
      secret: ${JWT_SECRET:defaultPassword}
      expiration: ${JWT_EXPIRATION:1800000}
  public-access:
    expiration-days: ${PUBLIC_ACCESS_EXPIRATION_DAYS:7}
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    persist-authorization: false
