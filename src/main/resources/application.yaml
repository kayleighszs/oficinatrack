spring:
  application:
    name: oficinatrack
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
api:
   security:
     token:
       secret: ${JWT_SECRET:minhaChaveSecretaSuperSeguraParaOProjetoOficinaTrack123!}
       expiration: ${JWT_EXPIRATION:7200000} # 2 horas em milissegundos